name: "CommitProof — verify receipt chain"
description: "Verify a repository's .titan/attestations/ receipt chain offline with THIS action's pinned verifier (not the repo's). SSH-signed receipts are checked with no secret; HMAC receipts need the key secret, and without it the action says they were not checked."
branding:
  icon: shield
  color: gray-dark
inputs:
  key:
    description: "Hex HMAC key (pass a secret). Only HMAC-signed receipts need it; omit it and SSH signatures are still checked."
    required: false
    default: ""
  report:
    description: "Path to write the markdown compliance report to (optional)."
    required: false
    default: ""
  allowed_signers:
    description: >-
      Trusted allowed_signers content (a secret or variable you control). When
      set, SSH signatures are checked against these keys instead of the audited
      repo's .titan/allowed_signers: the repo under audit should not decide who
      may sign. Omit it to trust the repo's file (changes to it are visible in
      git history).
    required: false
    default: ""
  allow_repo_verifier:
    description: >-
      DANGER — weakens the guarantee. When "true", run the verifier vendored in
      the repo under audit (.titan/tools/receipt.py) instead of this action's
      pinned copy. The repo's verifier is written by the same party who could
      have altered the receipts, so a tamperer can swap it for one that always
      passes. Leave "false" (default): the whole point of pinning this action to
      a ref is that its verifier is trusted and the audited repo's is not. Only
      set "true" for a deliberate canonicalization-compatibility case, and treat
      the result as self-reported, not independent.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Verify receipt chain
      shell: bash
      env:
        TITAN_KEY: ${{ inputs.key }}
        TITAN_REPORT: ${{ inputs.report }}
        TITAN_ALLOW_REPO_VERIFIER: ${{ inputs.allow_repo_verifier }}
        TITAN_ALLOWED_SIGNERS: ${{ inputs.allowed_signers }}
      run: |
        set -euo pipefail
        # Trust model: the verifier MUST be this action's own pinned copy, not
        # one supplied by the repository under audit. The audited repo's
        # .titan/tools/receipt.py is written by the same party who could have
        # altered the receipts — running it to "verify" them is self-audit and
        # defeats the point. Default to the pinned copy; use the repo's only on
        # explicit, loudly-documented opt-in.
        TOOL="${GITHUB_ACTION_PATH}/core/receipt.py"
        if [ "${TITAN_ALLOW_REPO_VERIFIER}" = "true" ] && [ -f ".titan/tools/receipt.py" ]; then
          echo "::warning title=CommitProof::Running the repo's own vendored verifier (allow_repo_verifier=true). This is NOT an independent check — the audited repo supplied the verifier. Result is self-reported."
          TOOL=".titan/tools/receipt.py"
        fi
        if [ ! -f "$TOOL" ]; then
          echo "::error title=CommitProof::verifier not found at $TOOL" >&2
          exit 1
        fi
        # Trusted signers, when given, replace the audited repo's own list.
        AS=""
        if [ -n "$TITAN_ALLOWED_SIGNERS" ]; then
          AS="${RUNNER_TEMP:-/tmp}/commitproof_allowed_signers"
          printf '%s\n' "$TITAN_ALLOWED_SIGNERS" > "$AS"
        fi
        rc=0
        if [ -n "$TITAN_KEY" ]; then
          mkdir -p .titan && printf '%s\n' "$TITAN_KEY" > .titan/key && chmod 600 .titan/key
          python3 "$TOOL" verify ${AS:+--allowed-signers "$AS"} || rc=$?
        else
          # no secret: SSH signatures are still checked; HMAC ones are reported unchecked
          python3 "$TOOL" verify --public-only ${AS:+--allowed-signers "$AS"} || rc=$?
        fi
        # The report is wanted MOST when verification fails — it records BROKEN.
        if [ -n "$TITAN_REPORT" ]; then
          python3 "$TOOL" report --out "$TITAN_REPORT" ${AS:+--allowed-signers "$AS"} || true
        fi
        if [ -n "$TITAN_KEY" ]; then rm -f .titan/key; fi
        exit $rc
